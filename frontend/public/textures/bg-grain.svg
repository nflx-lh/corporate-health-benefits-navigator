<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1200" viewBox="0 0 1920 1200" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#354138" />
      <stop offset="100%" stop-color="#222a25" />
    </linearGradient>
    <filter id="grain" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="noise" />
      <feColorMatrix
        in="noise"
        type="matrix"
        values="
          0 0 0 0 0.23
          0 0 0 0 0.27
          0 0 0 0 0.23
          0 0 0 0.16 0"
      />
    </filter>
    <radialGradient id="vignette" cx="50%" cy="42%" r="70%">
      <stop offset="55%" stop-color="#000000" stop-opacity="0" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.32" />
    </radialGradient>
  </defs>

  <rect width="1920" height="1200" fill="url(#bg)" />
  <rect width="1920" height="1200" filter="url(#grain)" />
  <rect width="1920" height="1200" fill="url(#vignette)" />
</svg>
