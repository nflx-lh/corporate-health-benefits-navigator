name: Build & Deploy to AWS

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: "Also update ECS services after push"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-southeast-1
  ECR_API_REPO: chbn-api
  ECR_WEB_REPO: chbn-web
  ECS_CLUSTER: chbn-cluster
  ECS_API_SERVICE: chbn-api
  ECS_WEB_SERVICE: chbn-web

jobs:
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    outputs:
      api_image: ${{ steps.images.outputs.api_image }}
      web_image: ${{ steps.images.outputs.web_image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image URIs
        id: images
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          echo "api_image=$REGISTRY/$ECR_API_REPO:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "web_image=$REGISTRY/$ECR_WEB_REPO:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build & push API image
        run: |
          docker build -f backend/Dockerfile.prod -t ${{ steps.images.outputs.api_image }} .
          docker push ${{ steps.images.outputs.api_image }}

      - name: Build & push Web image
        run: |
          docker build -f frontend/Dockerfile.prod -t ${{ steps.images.outputs.web_image }} ./frontend
          docker push ${{ steps.images.outputs.web_image }}

  deploy:
    name: Deploy to ECS
    needs: build-and-push
    if: github.event.inputs.deploy == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        working-directory: terraform/demo
        run: terraform init

      - name: Terraform apply (SHA-tagged images)
        working-directory: terraform/demo
        run: |
          terraform apply -auto-approve \
            -var="api_image=${{ needs.build-and-push.outputs.api_image }}" \
            -var="web_image=${{ needs.build-and-push.outputs.web_image }}"

      - name: Wait for API service stability
        run: |
          aws ecs wait services-stable --cluster $ECS_CLUSTER --services $ECS_API_SERVICE
          echo "API service stable"

      - name: Wait for Web service stability
        run: |
          aws ecs wait services-stable --cluster $ECS_CLUSTER --services $ECS_WEB_SERVICE
          echo "Web service stable"
