name: ci
on:
  push:
  pull_request:
jobs:
  backend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend deps
        run: |
          pip install -r backend/requirements.txt
      - name: Smoke import
        run: |
          python -c "import fastapi; print('backend deps ok')"
