services:
  db:
    image: postgres:16-alpine
    container_name: chbn_db
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chbn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chbn_dev}
      POSTGRES_DB: ${POSTGRES_DB:-chbn}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chbn}"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: chbn_api
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-chbn}:${POSTGRES_PASSWORD:-chbn_dev}@db:5432/${POSTGRES_DB:-chbn}
      PYTHONPATH: /app:/app/backend
      EMPLOYEE_DATA_PATH: /app/data/fixtures/employees.csv

      # LLM
      LLM_ENABLED: "true"
      LLM_PROVIDER: "openai"
      LLM_MODEL_NAME: "gpt-4o-mini"
      LLM_TIMEOUT_MS: "10000"
      MAX_EXPLAINER_RETRIES: "1"

      # Embeddings (make explicit to avoid env-default ambiguity)
      EMBEDDING_PROVIDER: "openai"
      EMBEDDING_MODEL: "text-embedding-3-small"
      EMBEDDING_TIMEOUT_MS: "10000"

      # Secrets
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
      - ./tests:/app/tests
      - ./data:/app/data
      - ./data:/data
      - ./scripts:/app/scripts
    working_dir: /app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --app-dir /app/backend
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    container_name: chbn_web
    env_file:
      - .env
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"

volumes:
  pgdata:
