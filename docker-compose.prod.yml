# docker-compose.prod.yml — local test of production images (no DB, no volumes)
# Usage: docker compose -f docker-compose.prod.yml up --build

services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile.prod
    container_name: chbn_api_prod
    environment:
      APP_ENV: development
      REPO_MODE: csv_only
      LLM_ENABLED: "true"
      LLM_PROVIDER: "openai"
      LLM_MODEL_NAME: "gpt-4o-mini"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      JWT_SECRET: local-test-secret
      CORS_ORIGINS: "http://localhost,http://localhost:80"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v1/health"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 3

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: chbn_web_prod
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy
